<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Arial, sans-serif"><rect width="1400" height="900" fill="#FFFFFF"></rect><text x="700" y="65" font-size="36" font-weight="700" fill="#0F2A47" text-anchor="middle">How Roles Evolve in a Vibe-Coded Design Process</text><text x="700" y="105" font-size="18" font-weight="400" fill="#6B7280" text-anchor="middle">The translation layer doesn't disappear. It changes shape, and the work moves closer to the source of intent.</text><rect x="60" y="170" width="280" height="70" fill="#0F2A47"></rect><rect x="340" y="170" width="460" height="70" fill="#1E4D7A"></rect><rect x="800" y="170" width="540" height="70" fill="#10B981"></rect><path d="M 68 170 Q 60 170 60 178 L 60 240 L 68 240 Z" fill="#0F2A47"></path><path d="M 1332 170 Q 1340 170 1340 178 L 1340 240 L 1332 240 Z" fill="#10B981"></path><text x="200" y="213" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">ROLE</text><text x="570" y="213" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">TRADITIONAL FUNCTION</text><text x="1070" y="213" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">EVOLVED FUNCTION</text><rect x="60" y="240" width="1280" height="130" fill="#F8FAFC"></rect><line x1="60" y1="240" x2="1340" y2="240" stroke="#E2E8F0" stroke-width="1"></line><line x1="340" y1="240" x2="340" y2="370" stroke="#E2E8F0" stroke-width="1"></line><line x1="800" y1="240" x2="800" y2="370" stroke="#E2E8F0" stroke-width="1"></line><circle cx="115" cy="305" r="24" fill="#DBEAFE"></circle><text x="115" y="314" font-size="22" font-weight="700" fill="#1E4D7A" text-anchor="middle">S</text><text x="155" y="298" font-size="20" font-weight="700" fill="#0F2A47">Stakeholder</text><text x="155" y="320" font-size="13" font-weight="400" fill="#6B7280">VP, Director,</text><text x="155" y="338" font-size="13" font-weight="400" fill="#6B7280">domain expert</text><text x="360" y="285" font-size="15" font-weight="700" fill="#475569">Describes what they want in words.</text><text x="360" y="312" font-size="14" font-weight="400" fill="#6B7280">Waits on design capacity. Settles for written</text><text x="360" y="332" font-size="14" font-weight="400" fill="#6B7280">specs that compress nuance and lose tacit</text><text x="360" y="352" font-size="14" font-weight="400" fill="#6B7280">domain knowledge.</text><text x="825" y="285" font-size="15" font-weight="700" fill="#0F2A47">Builds prototypes that show, not tell.</text><text x="825" y="312" font-size="14" font-weight="400" fill="#475569">Encodes tacit domain knowledge directly into</text><text x="825" y="332" font-size="14" font-weight="400" fill="#475569">the artifact. Iterates with AI in plain language</text><text x="825" y="352" font-size="14" font-weight="400" fill="#475569">until the interface matches their intent.</text><rect x="60" y="370" width="1280" height="130" fill="#FFFFFF"></rect><line x1="60" y1="370" x2="1340" y2="370" stroke="#E2E8F0" stroke-width="1"></line><line x1="340" y1="370" x2="340" y2="500" stroke="#E2E8F0" stroke-width="1"></line><line x1="800" y1="370" x2="800" y2="500" stroke="#E2E8F0" stroke-width="1"></line><circle cx="115" cy="435" r="24" fill="#FEF3C7"></circle><text x="115" y="444" font-size="22" font-weight="700" fill="#B45309" text-anchor="middle">P</text><text x="155" y="425" font-size="19" font-weight="700" fill="#0F2A47">Product Manager</text><text x="155" y="448" font-size="19" font-weight="700" fill="#0F2A47">/ BA</text><text x="155" y="470" font-size="13" font-weight="400" fill="#6B7280">Translation layer</text><text x="360" y="415" font-size="15" font-weight="700" fill="#475569">Translates business needs into</text><text x="360" y="435" font-size="15" font-weight="700" fill="#475569">technical specs.</text><text x="360" y="462" font-size="14" font-weight="400" fill="#6B7280">Owns requirements documents. Mediates</text><text x="360" y="482" font-size="14" font-weight="400" fill="#6B7280">every back-and-forth between sides.</text><text x="825" y="415" font-size="15" font-weight="700" fill="#0F2A47">Orchestrates the collaboration.</text><text x="825" y="442" font-size="14" font-weight="400" fill="#475569">Coaches stakeholders on prototyping.</text><text x="825" y="462" font-size="14" font-weight="400" fill="#475569">Curates Context Packs. Connects prototype</text><text x="825" y="482" font-size="14" font-weight="400" fill="#475569">artifacts to engineering architecture.</text><rect x="60" y="500" width="1280" height="130" fill="#F8FAFC"></rect><line x1="60" y1="500" x2="1340" y2="500" stroke="#E2E8F0" stroke-width="1"></line><line x1="340" y1="500" x2="340" y2="630" stroke="#E2E8F0" stroke-width="1"></line><line x1="800" y1="500" x2="800" y2="630" stroke="#E2E8F0" stroke-width="1"></line><circle cx="115" cy="565" r="24" fill="#E0E7FF"></circle><text x="115" y="574" font-size="22" font-weight="700" fill="#4338CA" text-anchor="middle">A</text><text x="155" y="558" font-size="20" font-weight="700" fill="#0F2A47">Architect</text><text x="155" y="580" font-size="13" font-weight="400" fill="#6B7280">Engineering</text><text x="155" y="598" font-size="13" font-weight="400" fill="#6B7280">leadership</text><text x="360" y="545" font-size="15" font-weight="700" fill="#475569">Interprets written specs.</text><text x="360" y="572" font-size="14" font-weight="400" fill="#6B7280">Asks "what did they mean by this</text><text x="360" y="592" font-size="14" font-weight="400" fill="#6B7280">requirement?" Surfaces structural issues</text><text x="360" y="612" font-size="14" font-weight="400" fill="#6B7280">late, often during testing.</text><text x="825" y="545" font-size="15" font-weight="700" fill="#0F2A47">Analyzes working artifacts.</text><text x="825" y="572" font-size="14" font-weight="400" fill="#475569">Asks "what are the architectural implications</text><text x="825" y="592" font-size="14" font-weight="400" fill="#475569">of what they built?" Catches data model and</text><text x="825" y="612" font-size="14" font-weight="400" fill="#475569">integration issues in week two, not week twelve.</text><rect x="60" y="630" width="1280" height="130" fill="#FFFFFF"></rect><line x1="60" y1="630" x2="1340" y2="630" stroke="#E2E8F0" stroke-width="1"></line><line x1="60" y1="760" x2="1340" y2="760" stroke="#E2E8F0" stroke-width="1"></line><line x1="340" y1="630" x2="340" y2="760" stroke="#E2E8F0" stroke-width="1"></line><line x1="800" y1="630" x2="800" y2="760" stroke="#E2E8F0" stroke-width="1"></line><circle cx="115" cy="695" r="24" fill="#DCFCE7"></circle><text x="115" y="704" font-size="22" font-weight="700" fill="#15803D" text-anchor="middle">E</text><text x="155" y="688" font-size="20" font-weight="700" fill="#0F2A47">Engineer</text><text x="155" y="710" font-size="13" font-weight="400" fill="#6B7280">Build and</text><text x="155" y="728" font-size="13" font-weight="400" fill="#6B7280">delivery</text><text x="360" y="675" font-size="15" font-weight="700" fill="#475569">Builds to specs.</text><text x="360" y="702" font-size="14" font-weight="400" fill="#6B7280">Receives requirements that have been</text><text x="360" y="722" font-size="14" font-weight="400" fill="#6B7280">filtered through two or three layers of</text><text x="360" y="742" font-size="14" font-weight="400" fill="#6B7280">interpretation. Discovers gaps in QA.</text><text x="825" y="675" font-size="15" font-weight="700" fill="#0F2A47">Pairs with AI agents on production builds.</text><text x="825" y="702" font-size="14" font-weight="400" fill="#475569">Works against confirmed plans governed by</text><text x="825" y="722" font-size="14" font-weight="400" fill="#475569">Context Packs. Reviews AI-generated code,</text><text x="825" y="742" font-size="14" font-weight="400" fill="#475569">handles edge cases, owns architectural quality.</text><rect x="60" y="800" width="1280" height="65" fill="#ECFDF5" stroke="#10B981" stroke-width="2" rx="8"></rect><text x="700" y="828" font-size="14" font-weight="700" fill="#10B981" text-anchor="middle" letter-spacing="2">THE PATTERN</text><text x="700" y="852" font-size="15" font-weight="500" fill="#0F2A47" text-anchor="middle">Every role moves closer to the source of intent. Translation work shrinks. Judgment work expands.</text><text x="1340" y="888" font-size="11" font-weight="500" fill="#94A3B8" text-anchor="end">HatchWorks AI · GenDD Methodology</text></svg>