<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Arial, sans-serif"><rect width="1400" height="1000" fill="#FFFFFF"></rect><text x="700" y="70" font-size="36" font-weight="700" fill="#0F2A47" text-anchor="middle">Speed vs. Risk: Where Each Approach Lives</text><text x="700" y="110" font-size="18" font-weight="400" fill="#6B7280" text-anchor="middle">Vibe coding for discovery, paired with GenDD for delivery, reaches the quadrant neither approach hits alone.</text><text x="80" y="540" font-size="22" font-weight="700" fill="#0F2A47" text-anchor="middle" transform="rotate(-90, 80, 540)" letter-spacing="3">SPEED</text><line x1="130" y1="900" x2="130" y2="200" stroke="#0F2A47" stroke-width="2"></line><polygon points="130,180 122,200 138,200" fill="#0F2A47"></polygon><text x="155" y="220" font-size="13" font-weight="600" fill="#6B7280">HIGH</text><text x="155" y="895" font-size="13" font-weight="600" fill="#6B7280">LOW</text><text x="700" y="960" font-size="22" font-weight="700" fill="#0F2A47" text-anchor="middle" letter-spacing="3">RISK</text><line x1="180" y1="900" x2="1280" y2="900" stroke="#0F2A47" stroke-width="2"></line><polygon points="1300,900 1280,892 1280,908" fill="#0F2A47"></polygon><text x="200" y="925" font-size="13" font-weight="600" fill="#6B7280">LOW</text><text x="1240" y="925" font-size="13" font-weight="600" fill="#6B7280">HIGH</text><rect x="190" y="200" width="540" height="330" fill="#0F2A47" rx="12"></rect><rect x="190" y="200" width="540" height="330" fill="none" stroke="#10B981" stroke-width="5" rx="12"></rect><circle cx="240" cy="250" r="22" fill="#10B981"></circle><text x="240" y="259" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">★</text><text x="280" y="258" font-size="14" font-weight="700" fill="#10B981" letter-spacing="2">THE SWEET SPOT</text><text x="460" y="320" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">Vibe Coding for Discovery</text><text x="460" y="352" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">+ GenDD for Delivery</text><text x="460" y="402" font-size="15" font-weight="400" fill="#B8C7D6" text-anchor="middle">Stakeholders prototype intent.</text><text x="460" y="425" font-size="15" font-weight="400" fill="#B8C7D6" text-anchor="middle">Architects reconcile reality.</text><text x="460" y="448" font-size="15" font-weight="400" fill="#B8C7D6" text-anchor="middle">AI agents execute against governed Context Packs.</text><text x="460" y="495" font-size="14" font-weight="700" fill="#10B981" text-anchor="middle" letter-spacing="1">FAST + GOVERNED</text><rect x="730" y="200" width="540" height="330" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" rx="12"></rect><circle cx="780" cy="250" r="22" fill="#FEE2E2"></circle><path d="M 780 240 L 770 258 L 790 258 Z" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-linejoin="round"></path><line x1="780" y1="246" x2="780" y2="252" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"></line><circle cx="780" cy="255" r="1" fill="#EF4444"></circle><text x="820" y="258" font-size="14" font-weight="700" fill="#EF4444" letter-spacing="2">FAST BUT RISKY</text><text x="1000" y="320" font-size="24" font-weight="700" fill="#0F2A47" text-anchor="middle">Vibe Coding Alone</text><text x="1000" y="382" font-size="15" font-weight="400" fill="#475569" text-anchor="middle">High velocity, no governance.</text><text x="1000" y="408" font-size="15" font-weight="400" fill="#475569" text-anchor="middle">No architecture discipline.</text><text x="1000" y="434" font-size="15" font-weight="400" fill="#475569" text-anchor="middle">No quality assurance on output.</text><text x="1000" y="490" font-size="14" font-weight="700" fill="#EF4444" text-anchor="middle" letter-spacing="1">FINE FOR PROTOTYPES, NOT PRODUCTION</text><rect x="190" y="530" width="540" height="330" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" rx="12"></rect><circle cx="240" cy="580" r="22" fill="#F1F5F9"></circle><circle cx="240" cy="580" r="11" fill="none" stroke="#64748B" stroke-width="2.5"></circle><line x1="240" y1="580" x2="240" y2="572" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"></line><line x1="240" y1="580" x2="246" y2="583" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"></line><text x="280" y="588" font-size="14" font-weight="700" fill="#64748B" letter-spacing="2">SLOW BUT SAFE</text><text x="460" y="650" font-size="24" font-weight="700" fill="#0F2A47" text-anchor="middle">Traditional Development</text><text x="460" y="712" font-size="15" font-weight="400" fill="#475569" text-anchor="middle">Layered review cycles.</text><text x="460" y="738" font-size="15" font-weight="400" fill="#475569" text-anchor="middle">Formal architecture documentation.</text><text x="460" y="764" font-size="15" font-weight="400" fill="#475569" text-anchor="middle">Months from business need to working software.</text><text x="460" y="820" font-size="14" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1">SAFE, BUT CYCLE TIME IS MONTHS</text><rect x="730" y="530" width="540" height="330" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="8,6" rx="12"></rect><text x="1000" y="680" font-size="20" font-weight="600" fill="#94A3B8" text-anchor="middle">No team operates here.</text><text x="1000" y="715" font-size="15" font-weight="400" fill="#94A3B8" text-anchor="middle">Slow execution paired with high risk</text><text x="1000" y="738" font-size="15" font-weight="400" fill="#94A3B8" text-anchor="middle">is the worst of both worlds.</text><text x="1280" y="990" font-size="11" font-weight="500" fill="#94A3B8" text-anchor="end">HatchWorks AI · GenDD Methodology</text></svg>