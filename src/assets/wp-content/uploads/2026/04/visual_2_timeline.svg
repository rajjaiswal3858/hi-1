<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 950" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Arial, sans-serif"><rect width="1600" height="950" fill="#FFFFFF"></rect><text x="800" y="65" font-size="36" font-weight="700" fill="#0F2A47" text-anchor="middle">From Weeks to Days: Compressing the Path from Intent to Production</text><text x="800" y="105" font-size="18" font-weight="400" fill="#6B7280" text-anchor="middle">Each handoff in the traditional flow is a translation point where context gets lost. Vibe coding eliminates the translators.</text><text x="80" y="200" font-size="13" font-weight="700" fill="#EF4444" letter-spacing="3">TRADITIONAL FLOW</text><text x="80" y="225" font-size="22" font-weight="700" fill="#0F2A47">Stakeholder to Delivery (3 to 4 weeks)</text><text x="80" y="252" font-size="14" font-weight="400" fill="#6B7280">Seven steps. Six handoffs. Context loss at every translation.</text><line x1="100" y1="370" x2="1500" y2="370" stroke="#FEE2E2" stroke-width="60" stroke-linecap="round"></line><g><rect x="100" y="330" width="160" height="80" fill="#FFFFFF" stroke="#EF4444" stroke-width="2" rx="8"></rect><text x="180" y="360" font-size="11" font-weight="700" fill="#EF4444" text-anchor="middle" letter-spacing="1">STEP 1</text><text x="180" y="383" font-size="14" font-weight="600" fill="#0F2A47" text-anchor="middle">Stakeholder</text><text x="180" y="400" font-size="14" font-weight="600" fill="#0F2A47" text-anchor="middle">writes spec</text></g><g><rect x="290" y="330" width="160" height="80" fill="#FFFFFF" stroke="#EF4444" stroke-width="2" rx="8"></rect><text x="370" y="360" font-size="11" font-weight="700" fill="#EF4444" text-anchor="middle" letter-spacing="1">STEP 2</text><text x="370" y="383" font-size="14" font-weight="600" fill="#0F2A47" text-anchor="middle">BA translates</text><text x="370" y="400" font-size="14" font-weight="600" fill="#0F2A47" text-anchor="middle">requirements</text></g><g><rect x="480" y="330" width="160" height="80" fill="#FFFFFF" stroke="#EF4444" stroke-width="2" rx="8"></rect><text x="560" y="360" font-size="11" font-weight="700" fill="#EF4444" text-anchor="middle" letter-spacing="1">STEP 3</text><text x="560" y="383" font-size="14" font-weight="600" fill="#0F2A47" text-anchor="middle">Designer</text><text x="560" y="400" font-size="14" font-weight="600" fill="#0F2A47" text-anchor="middle">wireframes</text></g><g><rect x="670" y="330" width="160" height="80" fill="#FFFFFF" stroke="#EF4444" stroke-width="2" rx="8"></rect><text x="750" y="360" font-size="11" font-weight="700" fill="#EF4444" text-anchor="middle" letter-spacing="1">STEP 4</text><text x="750" y="383" font-size="14" font-weight="600" fill="#0F2A47" text-anchor="middle">Stakeholder</text><text x="750" y="400" font-size="14" font-weight="600" fill="#0F2A47" text-anchor="middle">redlines</text></g><g><rect x="860" y="330" width="160" height="80" fill="#FFFFFF" stroke="#EF4444" stroke-width="2" rx="8"></rect><text x="940" y="360" font-size="11" font-weight="700" fill="#EF4444" text-anchor="middle" letter-spacing="1">STEP 5</text><text x="940" y="383" font-size="14" font-weight="600" fill="#0F2A47" text-anchor="middle">Engineering</text><text x="940" y="400" font-size="14" font-weight="600" fill="#0F2A47" text-anchor="middle">estimates</text></g><g><rect x="1050" y="330" width="160" height="80" fill="#FFFFFF" stroke="#EF4444" stroke-width="2" rx="8"></rect><text x="1130" y="360" font-size="11" font-weight="700" fill="#EF4444" text-anchor="middle" letter-spacing="1">STEP 6</text><text x="1130" y="383" font-size="14" font-weight="600" fill="#0F2A47" text-anchor="middle">Stakeholder</text><text x="1130" y="400" font-size="14" font-weight="600" fill="#0F2A47" text-anchor="middle">reprioritizes</text></g><g><rect x="1240" y="330" width="160" height="80" fill="#0F2A47" stroke="#0F2A47" stroke-width="2" rx="8"></rect><text x="1320" y="360" font-size="11" font-weight="700" fill="#FCA5A5" text-anchor="middle" letter-spacing="1">STEP 7</text><text x="1320" y="383" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Build, QA,</text><text x="1320" y="400" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">delivery</text></g><g font-size="10" font-weight="700" fill="#EF4444" text-anchor="middle" letter-spacing="1"><text x="275" y="450">↓ HANDOFF</text><text x="465" y="450">↓ HANDOFF</text><text x="655" y="450">↓ HANDOFF</text><text x="845" y="450">↓ HANDOFF</text><text x="1035" y="450">↓ HANDOFF</text><text x="1225" y="450">↓ HANDOFF</text></g><line x1="80" y1="510" x2="1520" y2="510" stroke="#E2E8F0" stroke-width="1"></line><text x="80" y="565" font-size="13" font-weight="700" fill="#10B981" letter-spacing="3">VIBE-CODED + GenDD FLOW</text><text x="80" y="590" font-size="22" font-weight="700" fill="#0F2A47">Stakeholder to Delivery (3 to 5 days)</text><text x="80" y="617" font-size="14" font-weight="400" fill="#6B7280">Four steps. One handoff. The prototype itself carries the context.</text><line x1="100" y1="730" x2="780" y2="730" stroke="#D1FAE5" stroke-width="60" stroke-linecap="round"></line><g><rect x="100" y="690" width="160" height="80" fill="#FFFFFF" stroke="#10B981" stroke-width="2" rx="8"></rect><text x="180" y="720" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle" letter-spacing="1">DAY 1</text><text x="180" y="743" font-size="13" font-weight="600" fill="#0F2A47" text-anchor="middle">Stakeholder</text><text x="180" y="760" font-size="13" font-weight="600" fill="#0F2A47" text-anchor="middle">vibe-codes prototype</text></g><g><rect x="270" y="690" width="160" height="80" fill="#FFFFFF" stroke="#10B981" stroke-width="2" rx="8"></rect><text x="350" y="720" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle" letter-spacing="1">DAY 2</text><text x="350" y="743" font-size="13" font-weight="600" fill="#0F2A47" text-anchor="middle">Architect reviews</text><text x="350" y="760" font-size="13" font-weight="600" fill="#0F2A47" text-anchor="middle">and confirms</text></g><g><rect x="440" y="690" width="160" height="80" fill="#FFFFFF" stroke="#10B981" stroke-width="2" rx="8"></rect><text x="520" y="720" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle" letter-spacing="1">DAYS 3 TO 4</text><text x="520" y="743" font-size="13" font-weight="600" fill="#0F2A47" text-anchor="middle">GenDD Pod</text><text x="520" y="760" font-size="13" font-weight="600" fill="#0F2A47" text-anchor="middle">executes build</text></g><g><rect x="610" y="690" width="160" height="80" fill="#0F2A47" stroke="#0F2A47" stroke-width="2" rx="8"></rect><text x="690" y="720" font-size="11" font-weight="700" fill="#86EFAC" text-anchor="middle" letter-spacing="1">DAY 5</text><text x="690" y="743" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Validate</text><text x="690" y="760" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">and deliver</text></g><text x="265" y="810" font-size="10" font-weight="700" fill="#10B981" text-anchor="middle" letter-spacing="1">↓ ONE HANDOFF</text><text x="265" y="826" font-size="10" font-weight="500" fill="#6B7280" text-anchor="middle">(prototype carries context)</text><rect x="810" y="660" width="690" height="140" fill="#ECFDF5" stroke="#10B981" stroke-width="2" stroke-dasharray="8,6" rx="12"></rect><text x="1155" y="710" font-size="14" font-weight="700" fill="#10B981" text-anchor="middle" letter-spacing="2">TIME SAVED</text><text x="1155" y="750" font-size="32" font-weight="700" fill="#0F2A47" text-anchor="middle">~2 to 3 weeks per cycle</text><text x="1155" y="780" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">Translation layers compressed. Stakeholder intent preserved end to end.</text><rect x="80" y="870" width="1440" height="60" fill="#0F2A47" rx="8"></rect><text x="800" y="908" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">The compression isn't about working faster. It's about removing the lossy translations between stakeholder intent and engineering execution.</text><text x="1500" y="940" font-size="11" font-weight="500" fill="#94A3B8" text-anchor="end">HatchWorks AI · GenDD Methodology</text></svg>